[package]
name = "linux-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
russh = { version = "0.63.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-keys = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }